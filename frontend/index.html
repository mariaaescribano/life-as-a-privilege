    <!-- Open Graph / Twitter: lo que se ve al compartir un enlace (WhatsApp,
         Instagram, Telegram…). Sin esto el enlace sale pelado.
         OJO: al cambiar de dominio hay que actualizar og:url, canonical y el
         sitemap.xml de /public. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Life as a Privilege" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Life as a Privilege — El Recorrido" />
    <meta
      property="og:description"
      content="Ocho disciplinas para conocerte: astrología, psicología, ayurveda, medicina china, fisiología, nutrición, cábala y cultura."
    />
    <meta property="og:url" content="https://lifeasaprivilege.onrender.com/" />
    <meta property="og:image" content="https://lifeasaprivilege.onrender.com/img/og/portada.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mandala de Life as a Privilege sobre fondo turquesa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Life as a Privilege — El Recorrido" />

      name="twitter:description"
      content="Ocho disciplinas para conocerte: astrología, psicología, ayurveda, medicina china, fisiología, nutrición, cábala y cultura."
    />
    <meta name="twitter:image" content="https://lifeasaprivilege.onrender.com/img/og/portada.png" />
    <meta name="theme-color" content="#008080" />

    <!-- El navegador NO oscurece la página por su cuenta. Sin esto, con el
         móvil en modo oscuro el auto-dark de Chrome/Edge/Samsung invertía
         fondos pero no todos los textos y psicología (cajas melocotón con
         letra marrón) se quedaba ilegible. El modo oscuro de la app es el de
         src/modoOscuro.css, y lo enciende la usuaria desde el header. -->
    <meta name="color-scheme" content="only light" />
    <script>
      // Deja puesto `data-modo` ANTES del primer pintado: si no, quien tenga
      // el modo oscuro activado vería un fogonazo claro en cada carga.
      // Misma clave y misma lógica que components/global/ModoOscuro.tsx: si se
      // cambia una, hay que cambiar la otra.
      (function () {
        try {
          var v = localStorage.getItem("modoLuz");
          var oscuro =
            v === "oscuro" ||
            (v !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-modo", oscuro ? "oscuro" : "claro");
        } catch (e) {
          /* sin localStorage: se queda en claro y el provider lo resuelve luego */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!--
      Google Analytics YA NO se carga aquí. Ponerlo en el <head> hacía que se
      instalasen sus cookies antes de que nadie diera su consentimiento, lo que
      incumple el RGPD y el art. 22.2 de la LSSI. Ahora lo carga en tiempo de
      ejecución src/components/global/cookies.ts, y solo si se acepta el aviso.
    -->

  </head>
  <body spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
