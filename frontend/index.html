<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/img/icono/iconoFondo-chocolate.png?v=5" />
    <link rel="shortcut icon" href="/img/icono/iconoFondo-chocolate.png?v=5" />
    <link rel="apple-touch-icon" href="/img/icono/iconoFondo-chocolate.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>María Escribano</title>
    <meta name="description" content="María Escribano" />
    <link rel="canonical" href="https://mariaescribano.onrender.com/" />

    <!-- Open Graph / Twitter: lo que se ve al compartir un enlace (WhatsApp,
         Instagram, Telegram…). Sin esto el enlace sale pelado.
         OJO: al cambiar de dominio hay que actualizar og:url, canonical y el
         sitemap.xml de /public. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="María Escribano" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="María Escribano" />
    <!-- Sin frases: al compartir el enlace solo sale el mandala y «María Escribano». OJO: no dejar la descripción VACÍA
         (WhatsApp y otras apps la ignoran y usan otra, y salía el texto de las ocho disciplinas). -->
    <meta property="og:description" content="María Escribano" />
    <meta property="og:url" content="https://mariaescribano.onrender.com/" />
    <meta property="og:image" content="https://mariaescribano.onrender.com/img/og/portada-chocolate.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mandala de Life as a Privilege sobre fondo beige" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="María Escribano" />
    <meta name="twitter:description" content="María Escribano" />
    <meta name="twitter:image" content="https://mariaescribano.onrender.com/img/og/portada-chocolate.png?v=3" />
    <meta name="theme-color" content="#F0DCC0" />

    <!-- El navegador NO oscurece la página por su cuenta. Sin esta línea, con
         el móvil (o Windows) en modo oscuro, el auto-dark de Chrome/Edge/
         Samsung Internet invierte fondos pero no los `fill` de los SVG: los
         iconos de las disciplinas (marrón #5e2d10 en psicología, verde
         #2b362a en nutrición…) se quedan casi blancos sobre acuarelas
         claras y no se ven. Toda la paleta son hex fijos de
         GlobalVariables.tsx, así que de los colores nos encargamos nosotros.
         OJO: esto ya se perdió una vez (commit «subir», 5a7a19f, que revirtió
         a4ee025). Si vuelve el modo oscuro de la app, se hace con una capa
         propia, nunca dejando suelto al navegador. -->
    <meta name="color-scheme" content="only light" />

    <!-- Dark Reader (la extensión) ignora el color-scheme de arriba: repinta
         los colores y APAGA los background-image de CSS, así que las tarjetas
         con foto de fondo (el mármol del popup de la llamada, por ejemplo) se
         quedaban transparentes. Este meta es su interruptor oficial: con él,
         Dark Reader deja la página en paz. -->
    <meta name="darkreader-lock" />

    <!--
      La EB Garamond ya NO viene de fonts.googleapis.com: cada visita mandaba la
      IP a Google sin consentimiento (RGPD). Se sirve desde la propia web con
      @fontsource/eb-garamond, importada en src/main.tsx.
    -->
    <!--
      Sin Google Analytics ni ningún otro rastreador: la web no usa cookies de seguimiento (nov-2026).
    -->

  </head>
  <body spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
